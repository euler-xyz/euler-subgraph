name: Goldsky deploy
run-name: ${{ inputs.action }} ${{ inputs.network }} ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      network:
        description: Network slug from scripts/config.ts, e.g. mainnet
        required: true
        type: string
      version:
        description: Version to deploy or tag, e.g. 1.0.7
        required: true
        type: string
      action:
        description: "deploy: deploy only. tag: point latest at a deployed version. deploy-and-tag: both; latest serves partial data until the new version syncs."
        required: true
        type: choice
        default: deploy
        options:
          - deploy
          - tag
          - deploy-and-tag

permissions:
  contents: read

concurrency:
  group: goldsky-${{ inputs.network }}
  cancel-in-progress: false

jobs:
  goldsky:
    name: ${{ inputs.action }} ${{ inputs.network }} ${{ inputs.version }}
    # scripts/abisAddressesSync.sh uses BSD sed (sed -i '').
    runs-on: macos-15
    timeout-minutes: 30
    env:
      NETWORK: ${{ inputs.network }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check inputs
        env:
          GOLDSKY_TOKEN: ${{ secrets.GOLDSKY_API_KEY }}
        run: |
          if [[ -z "$GOLDSKY_TOKEN" ]]; then
            echo "::error::The GOLDSKY_API_KEY repository secret is not set."
            exit 1
          fi
          if [[ ! "$NETWORK" =~ ^[a-z0-9-]+$ ]]; then
            echo "::error::network must be a slug from scripts/config.ts, such as mainnet."
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::version must look like 1.0.7, or 1.0.7.1 for a hotfix."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Resolve the subgraph name
        run: |
          networks=$(bun -e 'import { networks } from "./scripts/config"; console.log(Object.keys(networks).join(" "))')
          if [[ " $networks " != *" $NETWORK "* ]]; then
            echo "::error::Unknown network $NETWORK. scripts/config.ts has: $networks"
            exit 1
          fi
          protocol_version=$(bun -e 'import { PROTOCOL_VERSION } from "./scripts/config"; console.log(PROTOCOL_VERSION)')
          echo "SUBGRAPH=euler-${protocol_version}-${NETWORK}/${VERSION}" >> "$GITHUB_ENV"

      - name: Resolve the chain ID from euler-interfaces
        if: inputs.action != 'tag'
        run: |
          ref=$(git ls-remote https://github.com/euler-xyz/euler-interfaces.git refs/heads/master | cut -f1)
          if [[ -z "$ref" ]]; then
            echo "::error::Could not resolve euler-interfaces master."
            exit 1
          fi
          chains="$RUNNER_TEMP/EulerChains.json"
          curl -fsSL "https://raw.githubusercontent.com/euler-xyz/euler-interfaces/${ref}/EulerChains.json" -o "$chains"
          # A network slug is the chain's viemName in EulerChains.json, or its name when it has none, lowercased.
          chain_id=$(jq -r --arg slug "$NETWORK" \
            '[.[] | select(((.viemName // .name) | ascii_downcase) == $slug) | .chainId] | if length == 1 then .[0] else empty end' \
            "$chains")
          if [[ -z "$chain_id" ]]; then
            echo "::error::No chain in euler-interfaces EulerChains.json (${ref}) matches network $NETWORK."
            exit 1
          fi
          echo "$NETWORK is chain $chain_id in euler-interfaces ${ref}"
          {
            echo "CHAIN_ID=$chain_id"
            echo "EULER_INTERFACES_REF=$ref"
          } >> "$GITHUB_ENV"

      - name: Install dependencies
        if: inputs.action != 'tag'
        run: pnpm install --frozen-lockfile

      - name: Sync addresses from euler-interfaces
        if: inputs.action != 'tag'
        run: |
          ./scripts/abisAddressesSync.sh "$CHAIN_ID" "$EULER_INTERFACES_REF"
          git --no-pager diff --stat -- "contracts/addresses/$CHAIN_ID"

      - name: Check the config reads the synced addresses
        if: inputs.action != 'tag'
        run: |
          bun -e '
            import { networks } from "./scripts/config"
            const { NETWORK, CHAIN_ID } = process.env
            const synced = await import("./contracts/addresses/" + CHAIN_ID + "/coreAddresses.ts")
            if (networks[NETWORK].eVaultFactory !== synced.coreAddresses.eVaultFactory) {
              console.log("::error::scripts/config.ts does not read " + NETWORK + " from contracts/addresses/" + CHAIN_ID + ".")
              process.exit(1)
            }
          '

      - name: Codegen and build
        if: inputs.action != 'tag'
        run: |
          bun scripts/prepare.ts "$NETWORK"
          pnpm codegen
          pnpm build

      - name: Install the Goldsky CLI
        run: npm install --global --ignore-scripts @goldskycom/cli@13.15.1

      - name: Deploy
        if: inputs.action != 'tag'
        env:
          GOLDSKY_TOKEN: ${{ secrets.GOLDSKY_API_KEY }}
        run: goldsky subgraph deploy "$SUBGRAPH" --path . --token "$GOLDSKY_TOKEN"

      - name: Tag latest
        if: inputs.action != 'deploy'
        env:
          GOLDSKY_TOKEN: ${{ secrets.GOLDSKY_API_KEY }}
        run: goldsky subgraph tag create "$SUBGRAPH" --tag latest --token "$GOLDSKY_TOKEN"
