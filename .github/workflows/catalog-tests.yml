name: Catalog tests

on:
  pull_request:
    paths:
      - '.github/workflows/catalog-tests.yml'
      - '.gitignore'
      - 'scripts/catalog/**'
      - 'scripts/config.ts'
      - 'scripts/deploy-hotfix.ts'
      - 'tests/catalog/**'
      - 'catalog/**'
      - 'package.json'
  push:
    paths:
      - '.github/workflows/catalog-tests.yml'
      - '.gitignore'
      - 'scripts/catalog/**'
      - 'scripts/config.ts'
      - 'scripts/deploy-hotfix.ts'
      - 'tests/catalog/**'
      - 'catalog/**'
      - 'package.json'

permissions:
  contents: read

concurrency:
  group: catalog-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.0'
      - name: Run offline catalog regressions
        run: node --test tests/catalog/*.test.mjs
